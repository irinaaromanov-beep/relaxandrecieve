<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://googleapis.com">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: #E2E8F0;
            line-height: 1.8;
            font-family: 'Montserrat', sans-serif;
            background-color: #12181A;
        }

        header {
            background-color: #161F22;
            padding: 100px 20px 70px;
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .profile-container {
            margin-bottom: 25px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #D4AF37;
            padding: 6px;
            background-color: #161F22;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #FFF;
            font-weight: 400;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        header p {
            font-size: 1.1rem;
            color: #C0B7A6;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        section {
            margin-bottom: 90px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: #FFF;
            margin-bottom: 40px;
            text-align: center;
            font-weight: 400;
            letter-spacing: 1px;
            position: relative;
        }

        h2::after {
            content: '✦';
            display: block;
            font-size: 1rem;
            color: #D4AF37;
            margin-top: 10px;
            text-align: center;
            opacity: 0.7;
        }

        .announcement-card {
            background-color: #161F22;
            border: 1px solid rgba(212, 175, 55, 0.2);

        .announcement-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            color: #FFF;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .event-details {
            font-size: 1.15rem;
            color: #FFF;
            margin: 25px 0;
            background: rgba(255, 255, 255, 0.03);
            border-left: 2px solid #D4AF37;
            padding: 20px;
            border-radius: 4px;
            display: block;
            text-align: left;
            max-width: 500px;
            margin: 25px auto;
        }

        .event-details strong {
            color: #D4AF37;
            font-weight: 500;
        }

        .map-container {
            margin-top: 40px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.15);
            filter: grayscale(0.4) invert(0.9) hue-rotate(180deg);
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .map-container:hover {
            opacity: 1;
            filter: none;
        }

        .map-container iframe {
            width: 100%;
            height: 320px;
            border: 0;
            display: block;
        }

        .system-intro {
            background-color: #161F22;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 35px;
            border-radius: 6px;
            font-size: 1.05rem;
            color: #CBCBCB;
        }

        .modality-block {
            background: #161F22;
            padding: 40px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .modality-block h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #FFF;
            margin-bottom: 15px;

        }

        .modality-block p {
            color: #A0AEC0;

        }

        .external-link {
            color: #D4AF37;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            transition: all 0.2s;
        }

        .external-link:hover {
            color: #FFF;
            border-bottom-color: #FFF;
        }

        .price-table {
            width: 100%;
            border-collapse: collapse;
            background: #161F22;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 6px;
        }

        .price-table th, .price-table td {
            padding: 20px 25px;
            text-align: left;
        }

        .price-table th {
            background-color: rgba(212, 175, 55, 0.05);
            color: #FFF;
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 400;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .price-table tr {
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .price-table tr:last-child {
            border-bottom: none;
        }

        .price-table td.price {
            text-align: right;
            font-weight: 500;
            color: #D4AF37;
            font-size: 1.1rem;
        }

        .btn {
            display: inline-block;
            background-color: #D4AF37;
            color: #12181A;
            padding: 16px 45px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 4px;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .btn:hover {
            background-color: #FFF;
            color: #12181A;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,255,255,0.15);
        }

        .btn-secondary {
            display: inline-block;
            color: #D4AF37;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            color: #FFF;
            border-bottom-color: #FFF;
        }

        .cta-box {
            text-align: center;
            background: #161F22;
            padding: 55px 40px;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .phone-display {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin: 20px 0 8px;
            color: #FFF;
            letter-spacing: 1px;
        }

        .instagram-display {
            font-size: 1rem;
            margin-bottom: 30px;
            color: #C0B7A6;
        }

        .instagram-display a {
            color: #D4AF37;
            text-decoration: none;
            font-weight: 500;
        }

        .instagram-display a:hover {
            text-decoration: underline;
        }

        footer {
            background-color: #0D1112;
            color: #718096;
            text-align: center;
            padding: 40px 20px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255,255,255,0.02);
        }

        footer a {
            color: #C0B7A6;
            text-decoration: none;
            margin-left: 15px;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #D4AF37;
        }

        @media (max-width: 600px) {
            header { padding: 70px 20px 50px; }
            header h1 { font-size: 2.2rem; }
            h2 { font-size: 1.7rem; }
            .price-table th, .price-table td { padding: 15px 15px; font-size: 0.9rem; }
            .price-table th { font-size: 1.1rem; }
            .modality-block, .announcement-card, .cta-box { padding: 35px 20px; }
            .phone-display { font-size: 1.6rem; }
        }
    </style>
</head>
